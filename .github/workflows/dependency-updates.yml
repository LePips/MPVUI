name: Native dependency updates

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-dependency-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Resolve releases and verify update
        id: updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Build/update_dependencies.py --all --report .build/dependency-update.md
      - name: Open or refresh PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/dependencies/all
          title: ${{ steps.updates.outputs.title }}
          commit-message: ${{ steps.updates.outputs.title }}
          body-path: .build/dependency-update.md
          draft: false
          # Git's pathspec also matches the Android lock when that project is present.
          add-paths: Build/*.lock.json
