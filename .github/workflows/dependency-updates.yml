name: Native dependency updates

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-dependency-updates
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.components.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s Build/Tests -p test_update_dependencies.py
      - id: components
        run: echo "value=$(python3 Build/update_dependencies.py --list)" >> "$GITHUB_OUTPUT"

  update:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        component: ${{ fromJSON(needs.discover.outputs.components) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Resolve releases and verify update
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ matrix.component }}
        run: python3 Build/update_dependencies.py --component "$COMPONENT" --report .build/dependency-update.md
      - name: Open or refresh draft PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/dependencies/${{ matrix.component }}
          title: "build(deps): update ${{ matrix.component }}"
          commit-message: "build(deps): update ${{ matrix.component }}"
          body-path: .build/dependency-update.md
          draft: always-true
          # Git's pathspec also matches the Android lock when that project is present.
          add-paths: Build/*.lock.json
